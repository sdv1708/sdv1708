<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Sanjay DV</title>
  <desc id="description">Software Engineer focused on agentic systems and backend engineering</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c31"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".055"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="20" fill="url(#background)"/>
  <rect width="1200" height="300" rx="20" fill="url(#grid)"/>

  <circle cx="1040" cy="70" r="80" fill="#2563eb" opacity=".12" filter="url(#glow)"/>
  <circle cx="920" cy="235" r="72" fill="#14b8a6" opacity=".1" filter="url(#glow)"/>

  <rect x="72" y="64" width="42" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="72" y="135" fill="#f8fafc"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="58" font-weight="700" letter-spacing="1">SANJAY DV</text>
  <text x="75" y="180" fill="#a8b5c8"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="17" font-weight="500" letter-spacing="3">SOFTWARE ENGINEER</text>
  <text x="75" y="224" fill="#60a5fa"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="15" font-weight="600" letter-spacing="1.5">AGENTIC SYSTEMS  /  BACKEND ENGINEERING</text>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M805 91L905 56L1017 105L1110 67" stroke="#334155" stroke-width="2"/>
    <path d="M805 91L865 164L974 145L1088 204" stroke="#334155" stroke-width="2"/>
    <path d="M865 164L821 227L932 242L974 145" stroke="#334155" stroke-width="2"/>
    <path d="M1017 105L974 145L1088 204L1110 67" stroke="#334155" stroke-width="2"/>
    <path d="M905 56L974 145" stroke="url(#accent)" stroke-width="2.5" opacity=".85"/>
  </g>

  <g fill="#0f192b" stroke-width="3">
    <circle cx="805" cy="91" r="9" stroke="#60a5fa"/>
    <circle cx="905" cy="56" r="8" stroke="#475569"/>
    <circle cx="1017" cy="105" r="10" stroke="#2dd4bf"/>
    <circle cx="1110" cy="67" r="7" stroke="#475569"/>
    <circle cx="865" cy="164" r="10" stroke="#2dd4bf"/>
    <circle cx="974" cy="145" r="13" stroke="#60a5fa"/>
    <circle cx="1088" cy="204" r="9" stroke="#475569"/>
    <circle cx="821" cy="227" r="7" stroke="#475569"/>
    <circle cx="932" cy="242" r="10" stroke="#2dd4bf"/>
  </g>
</svg>
